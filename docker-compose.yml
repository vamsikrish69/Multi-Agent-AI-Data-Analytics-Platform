services:
  postgres:
    image: postgres:16
    container_name: ai-data-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_admin
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: mobility
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: