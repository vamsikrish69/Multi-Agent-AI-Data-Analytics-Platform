[project]
name = "ai-data-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain==1.3.1",
    "langgraph==1.2.2",
    "langchain-ollama==1.1.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "streamlit==1.41.1",
    "alembic==1.14.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "sqlglot==25.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-mock==3.14.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"